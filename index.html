<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Pôster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        input[type="file"] {
            margin: 20px 0;
        }
        canvas {
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: none;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Crie seu Pôster</h2>
        <p>Envie sua foto para aparecer dentro da moldura.</p>

        <input type="file" id="upload" accept="image/*">

        <canvas id="posterCanvas" width="1080" height="1527"></canvas>

        <button id="downloadBtn">Baixar Pôster</button>
    </div>

    <script>
        const uploadInput = document.getElementById('upload');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        // Link da imagem atualizado
        const overlayImageUrl = 'https://innerplay-media03-sa-production.s3.amazonaws.com/o/ff0becce-0658-4dd6-99f6-6dbe87adb109/d/77b9ef4b-6f58-4e51-aecb-b686578ad770/geminifalai2_edit_output.png?response-content-type=image%2Fpng&AWSAccessKeyId=AKIAQT3364IC6V6QDPWG&Signature=1s3WGL6PeiCLeylm1SmgbMZmFMI%3D&Expires=1780101522'; 

        // Configurações de posicionamento da foto
        const fotoX = 150;      
        const fotoY = 1100;     
        const fotoLargura = 780; 
        const fotoAltura = 400;  

        uploadInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const userImage = new Image();
                userImage.onload = function() {

                    const overlayImage = new Image();
                    overlayImage.crossOrigin = "Anonymous";
                    overlayImage.onload = function() {

                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        ctx.fillStyle = "#FFFFFF";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        const scale = Math.max(fotoLargura / userImage.width, fotoAltura / userImage.height);
                        const drawWidth = userImage.width * scale;
                        const drawHeight = userImage.height * scale;
                        const offsetX = fotoX + (fotoLargura - drawWidth) / 2;
                        const offsetY = fotoY + (fotoAltura - drawHeight) / 2;

                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(fotoX, fotoY, fotoLargura, fotoAltura);
                        ctx.clip();
                        ctx.drawImage(userImage, offsetX, offsetY, drawWidth, drawHeight);
                        ctx.restore();

                        ctx.drawImage(overlayImage, 0, 0, canvas.width, canvas.height);

                        canvas.style.display = 'block';
                        downloadBtn.style.display = 'inline-block';
                    };
                    overlayImage.src = overlayImageUrl;
                };
                userImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'meu-poster-moldura.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>

</body>
</html>
